<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>TokenFlux V6 · Unified Model Gateway Demo</title>
  <meta name="description" content="TokenFlux V6 interactive demo for a unified multi-provider AI model gateway.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23ecfdf3'/%3E%3Cpath d='M9 21V14M16 23V9M23 21V12' stroke='%230fb477' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <!-- PROTOTYPE ONLY: throwaway visual demo with mock data; not production code. -->
  <style>
    :root {
      --canvas: #09070c;
      --canvas-soft: #0f0c12;
      --surface-1: #19161d;
      --surface-2: #211d27;
      --surface-3: #28242e;
      --elevated: #352f3d;
      --accent: #9046ff;
      --accent-hover: #a66bff;
      --accent-soft: #c6a0ff;
      --accent-faint: rgba(144, 70, 255, 0.13);
      --accent-button: #7130ce;
      --accent-button-hover: #7d37df;
      --text: #f8f8fa;
      --text-2: #c9c3cf;
      --muted: #9b94a4;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --success: #35d482;
      --warning: #f6bd60;
      --danger: #ff6b7a;
      --info: #69b7ff;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --max-width: 1240px;
      --header-height: 64px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background:
        radial-gradient(circle at 78% -20%, rgba(144, 70, 255, 0.13), transparent 35%),
        var(--canvas);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 3px;
    }

    ::selection {
      background: rgba(144, 70, 255, 0.42);
      color: #fff;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-header {
      position: sticky;
      z-index: 50;
      top: 0;
      height: var(--header-height);
      border-bottom: 1px solid var(--border);
      background: rgba(9, 7, 12, 0.86);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      display: flex;
      width: min(calc(100% - 40px), var(--max-width));
      height: 100%;
      align-items: center;
      gap: 20px;
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 16px;
      font-weight: 760;
      letter-spacing: -0.035em;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 27px;
      height: 27px;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 3px;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgba(198, 160, 255, 0.45);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(144, 70, 255, 0.28), rgba(144, 70, 255, 0.04));
      box-shadow: inset 0 0 14px rgba(144, 70, 255, 0.15);
    }

    .brand-mark i {
      display: block;
      border-radius: 99px;
      background: var(--accent-soft);
      box-shadow: 0 0 8px rgba(198, 160, 255, 0.65);
    }

    .brand-mark i:nth-child(1) {
      height: 45%;
    }

    .brand-mark i:nth-child(2) {
      height: 100%;
    }

    .brand-mark i:nth-child(3) {
      height: 68%;
    }

    .brand em {
      color: var(--accent-soft);
      font-style: normal;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 550;
      transition: 160ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
    }

    .nav-link.active {
      box-shadow: inset 0 -1px 0 var(--accent);
    }

    .header-search {
      display: flex;
      width: min(260px, 24vw);
      align-items: center;
      gap: 9px;
      margin-left: auto;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: 160ms ease;
    }

    .header-search:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.055);
    }

    .header-search span:nth-child(2) {
      overflow: hidden;
      flex: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keycap {
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(53, 212, 130, 0.68);
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .button:hover {
      border-color: var(--border-strong);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    .button.primary {
      border-color: var(--accent-button);
      background: var(--accent-button);
      box-shadow: 0 8px 24px rgba(144, 70, 255, 0.23);
    }

    .button.primary:hover {
      border-color: var(--accent-button-hover);
      background: var(--accent-button-hover);
    }

    .button.ghost {
      background: transparent;
    }

    .button.small {
      min-height: 32px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .button.icon-only {
      width: 38px;
      padding: 0;
    }

    .mobile-toggle {
      display: none;
    }

    #app {
      min-height: calc(100vh - var(--header-height));
    }

    .page-shell {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
      padding: 44px 0 72px;
    }

    .page-shell.wide {
      width: min(calc(100% - 32px), 1390px);
    }

    .page-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--accent-soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .page-kicker::before {
      width: 18px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(36px, 5vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(26px, 3vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 18px;
      letter-spacing: -0.025em;
    }

    .muted {
      color: var(--muted);
    }

    .text-small {
      font-size: 12px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
    }

    .breadcrumb button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 590px;
      grid-template-columns: minmax(0, 0.92fr) minmax(480px, 1.08fr);
      align-items: center;
      gap: 64px;
      overflow: hidden;
      padding: 64px 0 54px;
    }

    .hero::before {
      position: absolute;
      z-index: -1;
      top: 7%;
      left: -17%;
      width: 630px;
      height: 630px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(144, 70, 255, 0.18), rgba(144, 70, 255, 0.035) 45%, transparent 70%);
      content: "";
      filter: blur(2px);
    }

    .hero-copy {
      max-width: 600px;
    }

    .hero-copy h1 span {
      background: linear-gradient(100deg, #fff 10%, var(--accent-soft) 78%);
      background-clip: text;
      color: transparent;
    }

    .hero-copy > p {
      max-width: 560px;
      margin-bottom: 26px;
      color: var(--text-2);
      font-size: 17px;
      line-height: 1.72;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .trust-line {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .trust-line span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .trust-line b {
      color: var(--success);
    }

    .route-console {
      position: relative;
      min-height: 470px;
      padding: 16px;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 40%),
        rgba(25, 22, 29, 0.88);
      box-shadow: var(--shadow), inset 0 0 70px rgba(144, 70, 255, 0.045);
    }

    .route-console::before {
      position: absolute;
      z-index: -1;
      inset: 15% -10%;
      border-radius: 50%;
      background: rgba(144, 70, 255, 0.2);
      content: "";
      filter: blur(80px);
    }

    .console-window-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 2px 14px;
      color: var(--muted);
      font: 11px "SFMono-Regular", Consolas, monospace;
    }

    .window-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--elevated);
    }

    .console-window-bar span:nth-child(4) {
      margin-left: 8px;
    }

    .route-map {
      position: relative;
      height: 245px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #100d13;
      background-size: 30px 30px;
    }

    .route-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .route-path {
      fill: none;
      stroke: rgba(198, 160, 255, 0.34);
      stroke-width: 1.25;
    }

    .route-path.active {
      stroke: var(--accent-soft);
      stroke-dasharray: 5 9;
      animation: routeFlow 1.3s linear infinite;
      filter: drop-shadow(0 0 4px rgba(198, 160, 255, 0.72));
    }

    .route-node {
      position: absolute;
      display: flex;
      min-width: 104px;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(33, 29, 39, 0.94);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .route-node.source {
      top: 96px;
      left: 20px;
      border-color: rgba(198, 160, 255, 0.5);
      color: var(--accent-soft);
    }

    .route-node.node-a {
      top: 24px;
      right: 19px;
    }

    .route-node.node-b {
      top: 100px;
      right: 19px;
    }

    .route-node.node-c {
      right: 19px;
      bottom: 22px;
    }

    .provider-glyph {
      display: grid;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: rgba(144, 70, 255, 0.13);
      color: var(--accent-soft);
      font-weight: 800;
    }

    .route-node small {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 8px;
    }

    .live-request {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--canvas-soft);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .live-request strong {
      color: var(--success);
      font-weight: 700;
    }

    .route-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .route-metric {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
    }

    .route-metric small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .route-metric b {
      font: 700 15px "SFMono-Regular", Consolas, monospace;
    }

    @keyframes routeFlow {
      to {
        stroke-dashoffset: -28;
      }
    }

    .section {
      padding: 74px 0;
      border-top: 1px solid var(--border);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .section-head p {
      max-width: 570px;
      margin-bottom: 0;
      color: var(--muted);
    }

    .model-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .model-card {
      position: relative;
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
      cursor: pointer;
      transition: 180ms ease;
    }

    .model-card:hover {
      border-color: rgba(198, 160, 255, 0.32);
      background: var(--surface-2);
      transform: translateY(-3px);
    }

    .model-card[role="link"],
    .directory-model[role="link"],
    .ranking-row[role="link"] {
      cursor: pointer;
    }

    .model-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .model-top > div:nth-child(2) {
      min-width: 0;
      flex: 1;
    }

    .model-name {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-provider {
      color: var(--muted);
      font-size: 11px;
    }

    .trend {
      color: var(--success);
      font: 700 11px "SFMono-Regular", Consolas, monospace;
    }

    .model-description {
      min-height: 42px;
      margin-bottom: 15px;
      color: var(--text-2);
      font-size: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--text-2);
      font-size: 10px;
      white-space: nowrap;
    }

    .tag.violet {
      border-color: rgba(144, 70, 255, 0.28);
      background: rgba(144, 70, 255, 0.09);
      color: var(--accent-soft);
    }

    .model-price {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .model-price small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .model-price b {
      font: 650 12px "SFMono-Regular", Consolas, monospace;
    }

    .value-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .value-card {
      min-height: 190px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(145deg, rgba(144, 70, 255, 0.06), transparent 47%),
        var(--surface-1);
    }

    .value-index {
      margin-bottom: 40px;
      color: var(--accent-soft);
      font: 700 12px "SFMono-Regular", Consolas, monospace;
    }

    .value-card p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .cta-panel {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: center;
      padding: 42px;
      overflow: hidden;
      border: 1px solid rgba(198, 160, 255, 0.22);
      border-radius: 20px;
      background:
        radial-gradient(circle at 85% 30%, rgba(144, 70, 255, 0.24), transparent 38%),
        var(--surface-1);
    }

    .code-window {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0d0b0f;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.26);
    }

    .code-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
    }

    pre {
      overflow: auto;
      margin: 0;
      padding: 18px;
      color: #d8d3dd;
      font: 11px/1.75 "SFMono-Regular", Consolas, monospace;
      tab-size: 2;
    }

    .code-purple {
      color: var(--accent-soft);
    }

    .code-green {
      color: var(--success);
    }

    .page-title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .page-title-row h1 {
      margin-bottom: 8px;
      font-size: clamp(36px, 4vw, 52px);
    }

    .page-title-row p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .models-layout {
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .filter-panel {
      position: sticky;
      top: calc(var(--header-height) + 46px);
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .filter-group + .filter-group {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .filter-label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 0;
      color: var(--text-2);
      cursor: pointer;
      font-size: 12px;
    }

    .check-row input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
    }

    .check-row span:last-child {
      margin-left: auto;
      color: var(--muted);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .range-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }

    .filter-chip.active {
      border-color: rgba(144, 70, 255, 0.45);
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .models-content {
      min-width: 0;
    }

    .model-toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      margin-bottom: 13px;

    .input-shell {

      color: var(--text-2);

      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
    }

    .view-button {
      width: 34px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;

    .view-button.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 10px;

    .models-results {
      display: grid;
      gap: 10px;
    }

    .directory-model {
      display: grid;
      grid-template-columns: minmax(230px, 1.35fr) minmax(150px, 0.85fr) 145px 130px 40px;
      align-items: center;
      gap: 18px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
      cursor: pointer;
      transition: 160ms ease;
    }

    .directory-model:hover {
      border-color: rgba(198, 160, 255, 0.28);
      background: var(--surface-2);
    }

    .directory-main {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .directory-main > div:last-child {
      min-width: 0;
    }

    .directory-main h3 {
      overflow: hidden;
      margin: 0 0 3px;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .directory-main p {
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .directory-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .directory-stat small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .directory-stat b {
      font: 600 11px "SFMono-Regular", Consolas, monospace;
    }

    .compare-check {
      display: grid;
      width: 24px;
      height: 24px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: transparent;
      color: transparent;
      cursor: pointer;
    }

    .compare-check.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .models-results.grid-view {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .models-results.grid-view .directory-model {
      display: block;
      min-height: 240px;
    }

    .models-results.grid-view .directory-tags {
      min-height: 30px;
      margin: 17px 0;
    }

    .models-results.grid-view .directory-stat {
      display: inline-block;
      width: 31%;
      vertical-align: top;
    }

    .models-results.grid-view .compare-check {
      position: absolute;
      top: 15px;
      right: 15px;
    }

    .models-results.grid-view .directory-model {
      position: relative;
    }

    .compare-bar {
      position: fixed;
      z-index: 45;
      right: 50%;
      bottom: 18px;
      display: none;
      width: min(calc(100% - 32px), 660px);
      align-items: center;
      gap: 10px;
      padding: 10px;
      border: 1px solid rgba(198, 160, 255, 0.3);
      border-radius: 13px;
      background: rgba(25, 22, 29, 0.94);
      box-shadow: var(--shadow);
      transform: translateX(50%);
      backdrop-filter: blur(18px);
    }

    .compare-bar.visible {
      display: flex;
    }

    .compare-list {
      display: flex;
      min-width: 0;
      flex: 1;
      gap: 6px;
      overflow: auto;
    }

    .compare-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-2);
      font-size: 10px;
      white-space: nowrap;
    }

      padding: 0;
      border: 0;
      background: transparent;
      color: var(--muted);
      cursor: pointer;

      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      margin-bottom: 28px;
    }

      align-items: start;
      gap: 16px;
    }

      height: 48px;
      border-radius: 13px;
      font-size: 17px;
    }

    .detail-identity h1 {
      margin: 0 0 5px;
      font-size: clamp(30px, 4vw, 48px);

    .model-slug {

      color: var(--text-2);

      font-size: 10px;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
    }

    }

    .metric-card {
      padding: 15px;

      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .metric-card small {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

      display: block;
      font: 700 15px "SFMono-Regular", Consolas, monospace;

    .metric-card span {

    .content-card {
      padding: 22px;

      background: var(--surface-1);

      background: var(--surface-3);

      border-radius: var(--radius);
      background: var(--surface-1);

      border-bottom: 1px solid var(--border);

      font-weight: 700;
      text-transform: uppercase;

      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);

      gap: 34px;

      font-size: 12px;
      text-align: left;

      grid-column: span 5;

    }

    .dashboard-card.span-12 {

      font-size: 11px;
      white-space: nowrap;

      text-transform: uppercase;

    .modal {
      width: min(100%, 500px);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      background: var(--surface-1);
      box-shadow: var(--shadow);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 19px;
      border-bottom: 1px solid var(--border);
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: 0;
    }

    .modal-header h3 {
      margin: 0;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-body {
      padding: 19px;
    }

    .form-row + .form-row {
      margin-top: 16px;
    }

    .form-row label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 650;
    }

    .form-input {
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      background: var(--canvas-soft);
      color: var(--text);
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .secret-box {
      padding: 15px;
      border: 1px solid rgba(246, 189, 96, 0.28);
      border-radius: 10px;
      background: rgba(246, 189, 96, 0.07);
    }

    .secret-value {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d0b0f;
      font: 10px "SFMono-Regular", Consolas, monospace;
      word-break: break-all;
    }

    .secret-value span {
      flex: 1;
    }

    .compare-modal {
      width: min(100%, 920px);
    }

    .comparison-grid {
      display: grid;
      grid-template-columns: 150px repeat(3, minmax(160px, 1fr));
      overflow: auto;
    }

    .comparison-cell {
      min-width: 0;
      padding: 13px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
    }

    .comparison-cell:nth-child(4n) {
      border-right: 0;
    }

    .comparison-cell.label {
      color: var(--muted);
    }

    .command-modal {
      width: min(100%, 660px);
      align-self: start;
      margin-top: 10vh;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: rgba(25, 22, 29, 0.98);
      box-shadow: var(--shadow);
    }

    .command-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .command-input-row input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .command-list {
      max-height: 370px;
      overflow: auto;
      padding: 8px;
    }

    .command-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .command-item:hover,
    .command-item.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .command-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent-soft);
      font-size: 11px;
    }

    .command-item > span:nth-child(2) {
      flex: 1;
    }

    .command-item small {
      color: var(--muted);
    }

    .mobile-drawer {
      width: min(340px, 90vw);
      height: 100%;
      margin-left: auto;
      padding: 18px;
      background: var(--surface-1);
      box-shadow: var(--shadow);
    }

    .mobile-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .mobile-nav {
      display: grid;
      gap: 5px;
    }

    .mobile-nav button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .mobile-nav button:hover {
      background: var(--surface-3);
    }

    .toast-region {
      position: fixed;
      z-index: 120;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      min-width: 250px;
      padding: 12px 14px;
      border: 1px solid rgba(198, 160, 255, 0.3);
      border-radius: 10px;
      background: rgba(33, 29, 39, 0.96);
      box-shadow: var(--shadow);
      color: var(--text-2);
      font-size: 12px;
      animation: toastIn 180ms ease both;
    }

    .toast strong {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .site-footer {
      border-top: 1px solid var(--border);
      background: #070509;
    }

    .footer-inner {
      display: flex;
      width: min(calc(100% - 40px), var(--max-width));
      min-height: 96px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 11px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .mobile-filter-button {
      display: none;
    }

    @media (max-width: 1080px) {
      .primary-nav,
      .status-pill {
        display: none;
      }

      .header-search {
        margin-left: auto;
      }

      .mobile-toggle {
        display: inline-flex;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .hero-copy {
        max-width: 720px;
      }

      .route-console {
        max-width: 760px;
      }

      .model-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .directory-model {
        grid-template-columns: minmax(220px, 1.2fr) minmax(140px, 0.8fr) 125px 40px;
      }

      .directory-model .directory-stat.context-stat {
        display: none;
      }

      .metric-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .ranking-hero {
        grid-template-columns: 1fr;
      }

      .docs-layout {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .docs-toc {
        display: none;
      }

      .dashboard-card.span-3 {
        grid-column: span 6;
      }

      .dashboard-card.span-5,
      .dashboard-card.span-7 {
        grid-column: span 12;
      }
    }

    @media (max-width: 800px) {
      .header-inner {
        width: min(calc(100% - 24px), var(--max-width));
        gap: 10px;
      }

      .brand > span:last-child {
        display: none;
      }

      .header-search {
        width: 40px;
        justify-content: center;
      }

      .header-search span:not(:first-child) {
        display: none;
      }

      .header-actions .button:not(.mobile-toggle) {
        display: none;
      }

      .page-shell,
      .page-shell.wide {
        width: min(calc(100% - 24px), var(--max-width));
        padding-top: 30px;
      }

      .hero {
        min-height: 0;
        padding-top: 40px;
      }

      .route-console {
        min-height: 430px;
      }

      .section {
        padding: 54px 0;
      }

      .section-head,
      .page-title-row,
      .console-heading {
        align-items: start;
        flex-direction: column;
      }

      .section-head,
      .page-title-row {
        display: flex;
      }

      .value-grid,
      .pricing-grid {
        grid-template-columns: 1fr;
      }

      .cta-panel {
        grid-template-columns: 1fr;
        padding: 26px;
      }

      .models-layout {
        grid-template-columns: 1fr;
      }

      .filter-panel {
        position: fixed;
        z-index: 80;
        right: 12px;
        bottom: 74px;
        left: 12px;
        top: auto;
        display: none;
        max-height: 68vh;
        overflow: auto;
        box-shadow: var(--shadow);
      }

      .filter-panel.open {
        display: block;
      }

      .mobile-filter-button {
        position: fixed;
        z-index: 44;
        right: 14px;
        bottom: 17px;
        display: inline-flex;
      }

      .directory-model {
        grid-template-columns: minmax(0, 1fr) 40px;
      }

      .directory-model .directory-tags,
      .directory-model .directory-stat {
        display: none;
      }

      .models-results.grid-view {
        grid-template-columns: 1fr;
      }

      .detail-actions {
        flex-wrap: wrap;
      }

      .model-detail-header {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .detail-layout {
        grid-template-columns: 1fr;
      }

      .estimator {
        position: static;
      }

      .ranking-row {
        grid-template-columns: 28px minmax(0, 1fr) 58px;
        gap: 8px;
        padding: 12px 10px;
      }

      .ranking-row > :nth-child(3),
      .ranking-row > :nth-child(4),
      .ranking-row > :nth-child(5) {
        display: none;
      }

      .docs-layout {
        grid-template-columns: 1fr;
      }

      .docs-sidebar {
        position: static;
        display: flex;
        gap: 7px;
        overflow-x: auto;
      }

      .docs-nav-group {
        display: contents;
      }

      .docs-nav-title {
        display: none;
      }

      .docs-link {
        width: auto;
        min-width: max-content;
        border: 1px solid var(--border);
        border-radius: 7px;
      }

      .console-shell {
        grid-template-columns: 1fr;
      }

      .console-sidebar {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 10px 12px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }

      .account-card,
      .console-nav-label {
        display: none;
      }

      .console-nav {
        display: flex;
        gap: 5px;
        margin: 0;
      }

      .console-nav-button {
        min-width: max-content;
      }

      .console-main {
        padding: 24px 12px 70px;
      }

      .dashboard-card.span-3,
      .dashboard-card.span-5,
      .dashboard-card.span-7,
      .dashboard-card.span-12 {
        grid-column: span 12;
      }

      .key-toolbar {
        align-items: stretch;
        flex-direction: column;
      }

      .data-table {
        min-width: 680px;
      }

      .table-scroll {
        overflow: auto;
      }
    }

    @media (max-width: 520px) {
      .hero-copy > p {
        font-size: 15px;
      }

      .hero-actions .button {
        width: 100%;
      }

      .route-console {
        min-height: 405px;
        padding: 11px;
        border-radius: 15px;
      }

      .route-map {
        height: 220px;
      }

      .route-node {
        min-width: 93px;
        padding: 7px;
        font-size: 8px;
      }

      .route-node.source {
        left: 10px;
      }

      .route-node.node-a,
      .route-node.node-b,
      .route-node.node-c {
        right: 10px;
      }

      .model-strip {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }

      .metric-card {
        padding: 12px;
      }

      .model-toolbar {
        grid-template-columns: 1fr auto;
      }

      .model-toolbar .select {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .compare-bar {
        bottom: 68px;
      }

      .comparison-grid {
        grid-template-columns: 110px repeat(3, 140px);
      }

      .footer-inner {
        align-items: start;
        flex-direction: column;
        padding: 24px 0;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Customer color system + OpenRouter-inspired homepage composition. */
    :root {
      color-scheme: light;
      --canvas: #f4f6f8;
      --canvas-soft: #f8fafb;
      --surface-1: #ffffff;
      --surface-2: #f8fafb;
      --surface-3: #eff1ec;
      --elevated: #e4e7ec;
      --accent: #0fb477;
      --accent-hover: #0aa668;
      --accent-soft: #067647;
      --accent-faint: #ecfdf3;
      --accent-button: #0fb477;
      --accent-button-hover: #0aa668;
      --text: #101828;
      --text-2: #475467;
      --muted: #667085;
      --border: #e4e7ec;
      --border-strong: #d9dee6;
      --success: #0fb477;
      --warning: #b54708;
      --danger: #d92d20;
      --info: #1570ef;
      --shadow: 0 12px 36px rgba(16, 24, 40, 0.08);
    }

    body {
      background: var(--canvas);
      color: var(--text);
    }

    ::selection {
      background: rgba(15, 180, 119, 0.22);
      color: #03301f;
    }

    .app-header {
      border-bottom-color: var(--border);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.02);
    }

    .header-inner {
      width: min(calc(100% - 40px), 1440px);
    }

    .brand {
      order: 1;
      color: var(--text);
    }

    .brand-mark {
      border-color: #abefc6;
      background: linear-gradient(145deg, #ecfdf3, #d1fadf);
      box-shadow: inset 0 0 12px rgba(15, 180, 119, 0.08);
    }

    .brand-mark i {
      background: var(--accent);
      box-shadow: none;
    }

    .brand em {
      color: var(--accent-soft);
    }

    .primary-nav {
      order: 3;
      margin-left: auto;
    }

    .header-search {
      order: 2;
      width: min(280px, 23vw);
      margin-left: 12px;
      border-color: var(--border);
      background: #f8fafb;
      color: var(--muted);
    }

    .header-search:hover {
      border-color: #abefc6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 180, 119, 0.08);
    }

    .header-actions {
      order: 4;
    }

    .keycap {
      border-color: var(--border);
      background: #ffffff;
      color: var(--muted);
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .nav-link.active {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .button {
      border-color: var(--border-strong);
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .button:hover {
      border-color: #abefc6;
      background: #f8fafb;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #03301f;
      box-shadow: 0 10px 24px rgba(15, 180, 119, 0.16);
    }

    .button.primary:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
      color: #021f15;
    }

    .page-kicker,
    .value-index {
      color: var(--accent-soft);
    }

    .provider-glyph {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .tag {
      border-color: var(--border);
      background: #f8fafb;
      color: var(--text-2);
    }

    .tag.violet {
      border-color: #abefc6;
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .model-card,
    .value-card,
    .content-card,
    .pricing-card,
    .dashboard-card,
    .filter-panel,
    .directory-model,
    .ranking-list,
    .ranking-summary,
    .metric-card,
    .estimator {
      border-color: var(--border);
      background: var(--surface-1);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.035);
    }

    .model-card:hover,
    .directory-model:hover,
    .ranking-row:hover {
      border-color: #abefc6;
      background: #fbfffd;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.06);
    }

    .input-shell,
    .select,
    .view-toggle,
    .form-input {
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .filter-chip,
    .compare-check,
    .inline-copy {
      border-color: var(--border);
      color: var(--muted);
    }

    .filter-chip.active {
      border-color: #abefc6;
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .compare-check.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #03301f;
    }

    .compare-bar {
      border-color: #abefc6;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
    }

    .compare-chip {
      border-color: var(--border);
      background: #f8fafb;
    }

    .bar-chart,
    .usage-chart {
      border-bottom-color: var(--border);
    }

    .chart-bar,
    .usage-bar {
      background: linear-gradient(180deg, #0fb477, rgba(15, 180, 119, 0.18));
      box-shadow: 0 0 18px rgba(15, 180, 119, 0.12);
    }

    .console-sidebar {
      border-right-color: var(--border);
      background: rgba(248, 250, 251, 0.9);
    }

    .account-card,
    .quick-action {
      border-color: var(--border);
      background: #ffffff;
    }

    .console-nav-button:hover,
    .console-nav-button.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .avatar {
      background: linear-gradient(135deg, #0fb477, #067647);
      color: #ffffff;
    }

    .modal {
      border-color: var(--border-strong);
      background: #ffffff;
    }

    .command-modal {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.98);
    }

    .command-item:hover,
    .command-item.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .mobile-drawer {
      background: #ffffff;
    }

    .toast {
      border-color: #abefc6;
      background: rgba(255, 255, 255, 0.98);
      color: var(--text-2);
    }

    .toast strong {
      color: var(--text);
    }

    .site-footer {
      border-top-color: var(--border);
      background: #ffffff;
    }

    .code-window {
      border-color: #344054;
      background: #101828;
    }

    .code-titlebar {
      border-bottom-color: #344054;
      color: #98a2b3;
    }

    .code-window .inline-copy {
      border-color: #475467;
      color: #d0d5dd;
    }

    .code-purple {
      color: #6ce9a6;
    }

    .code-green {
      color: #32d583;
    }

    .secret-value {
      border-color: #344054;
      background: #101828;
      color: #f2f4f7;
    }

    .secret-value .inline-copy {
      border-color: #475467;
      color: #d0d5dd;
    }

    .callout {
      border-color: #b2ddff;
      background: #eff8ff;
    }

    .value-card {
      background:
        linear-gradient(145deg, #ecfdf3, transparent 48%),
        #ffffff;
    }

    .cta-panel {
      border-color: #abefc6;
      background:
        linear-gradient(145deg, #ecfdf3, rgba(236, 253, 243, 0) 48%),
        #ffffff;
    }

    .pricing-card.featured {
      border-color: #abefc6;
      background:
        linear-gradient(180deg, #ecfdf3, rgba(236, 253, 243, 0) 44%),
        #ffffff;
    }

    .quick-action:hover {
      border-color: #abefc6;
      background: #fbfffd;
    }

    .premium-home {
      position: relative;
      overflow: hidden;
      background: var(--canvas);
    }

    .premium-shell {
      width: min(calc(100% - 40px), 1440px);
      padding-top: 0;
    }

    .premium-hero {
      position: relative;
      display: grid;
      min-height: 670px;
      place-items: center;
      text-align: center;
    }

    .premium-hero-copy {
      position: relative;
      z-index: 2;
      width: min(100%, 920px);
      padding-bottom: 150px;
    }

    .premium-overline {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 20px;
      color: var(--accent-soft);
      font-size: 12px;
      font-weight: 720;
      letter-spacing: 0.08em;
    }

    .premium-overline::before,
    .premium-overline::after {
      width: 20px;
      height: 1px;
      background: #abefc6;
      content: "";
    }

    .premium-title {
      max-width: 880px;
      margin: 0 auto 22px;
      color: var(--text);
      font-size: clamp(64px, 6vw, 72px);
      font-weight: 760;
      line-height: 1.02;
      letter-spacing: -0.055em;
      text-wrap: balance;
    }

    .premium-title span {
      color: var(--accent-soft);
      white-space: nowrap;
    }

    .premium-subtitle {
      max-width: 640px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.75;
      text-wrap: balance;
    }

    .premium-actions {

  .premium-home .sr-agent-card,
  .premium-home .sr-blog-card {
    border-color: color-mix(in srgb, var(--border) 86%, var(--accent) 14%);
    box-shadow: 0 1px 2px color-mix(in srgb, var(--text) 4%, transparent);
  }

  .premium-home .sr-feature-card:hover,
  .premium-home .sr-model-card:hover,
  .premium-home .sr-agent-card:hover,
  .premium-home .sr-blog-card:hover {
    border-color: color-mix(in srgb, var(--border-strong) 74%, var(--accent) 26%);
    box-shadow: 0 12px 28px color-mix(in srgb, var(--text) 8%, transparent);
    transform: translateY(-2px);
  }

  .premium-home .sr-model-card {
    position: relative;
    min-height: 196px;
    padding: 20px;
  }

  .premium-home .sr-model-card::after {
    position: absolute;
    right: 20px;
    bottom: 18px;
    color: var(--accent-soft);
    content: '查看详情 ↗';
    font-size: 11px;
    font-weight: 700;
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 160ms ease, transform 160ms ease;
  }

  .premium-home .sr-model-card:hover::after,
  .premium-home .sr-model-card:focus-visible::after {
    opacity: 1;
    transform: translateY(0);
  }

  .premium-home .sr-model-data {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
  }

  .premium-home .sr-model-data span {
    display: grid;
    min-width: 0;
    gap: 4px;
  }

  .premium-home .sr-model-data small {
    color: var(--muted);
    font-size: 10px;
  }

  .premium-home .sr-model-data b {
    color: var(--text);
    font: 700 13px/1.2 var(--data-font);
  }

  .premium-home .sr-onboarding {
    padding-block: 56px;
    border-block: 1px solid var(--border);
  }

  .premium-home .sr-step {
    padding-inline: 18px;
  }

  .premium-home .sr-step + .sr-step {
    border-left-color: var(--border-strong);
  }

  .premium-home .sr-step p {
    max-width: 250px;
    line-height: 1.65;
  }

  .command-item[aria-selected='true'] {
    background: var(--surface-3);
    color: var(--text);
    box-shadow: inset 3px 0 0 var(--accent);
  }

  @media (max-width: 767px) {
    .premium-home .sr-section-head {
      margin-bottom: 16px;
    }

    .premium-home .sr-feature-grid,
    .premium-home .sr-model-grid,
    .premium-home .sr-agent-grid,
    .premium-home .sr-blog-grid {
      gap: 12px;
    }

    .premium-home .sr-model-card {
      min-height: 0;
      padding: 19px;
    }

    .premium-home .sr-model-card::after {
      right: 19px;
      bottom: 16px;
      opacity: 1;
      transform: none;
    }

    .premium-home .sr-onboarding {
      padding-block: 42px;
    }

    .premium-home .sr-step {
      padding-inline: 0;
    }

    .premium-home .sr-step + .sr-step {
      border-left: 0;
      border-top: 1px solid var(--border);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .premium-home .sr-feature-card,
    .premium-home .sr-model-card,
    .premium-home .sr-agent-card,
    .premium-home .sr-blog-card,
    .premium-home .sr-model-card::after {
      transition: none;
    }
  }
</style>

        window.setTimeout(function () {

          if (target) target.focus()
        }, 30)

      function closeOverlay(id) {
        var overlay = document.getElementById(id)
        if (!overlay) return

      function trapOverlayFocus(event) {
        if (event.key !== 'Tab') return
        var overlay = document.querySelector('.modal-backdrop.open, .command-backdrop.open, .mobile-backdrop.open')
        if (!overlay) return
        var focusable = Array.from(overlay.querySelectorAll('button:not([disabled]), input:not([disabled]), select:not([disabled]), [tabindex]:not([tabindex="-1"])'))
        if (!focusable.length) {
          event.preventDefault()
          return
        }
        var first = focusable[0]
        var last = focusable[focusable.length - 1]
        if (event.shiftKey && document.activeElement === first) {
          event.preventDefault()
          last.focus()
        } else if (!event.shiftKey && document.activeElement === last) {
          event.preventDefault()
          first.focus()
        }
      }

        cards.forEach(function (card) {
          var matchesQuery = !query || (card.getAttribute('data-name') + ' ' + card.getAttribute('data-provider') + ' ' + card.getAttribute('data-abilities')).toLowerCase().indexOf(query) >= 0
          var matchesProvider = providers.length === 0 || providers.indexOf(card.getAttribute('data-provider')) >= 0
          var matchesAbility = !activeAbility || card.getAttribute('data-abilities').split(' ').indexOf(activeAbility) >= 0
          var matchesContext = Number(card.getAttribute('data-context')) >= activeContext
          var show = matchesQuery && matchesProvider && matchesAbility && matchesContext
          card.style.display = show ? '' : 'none'
          if (show) visible.push(card)
        })

        var sort = (document.getElementById('model-sort') || {}).value || 'popular'
        visible.sort(function (a, b) {
          if (sort === 'price') return Number(a.getAttribute('data-price')) - Number(b.getAttribute('data-price'))
          if (sort === 'context') return Number(b.getAttribute('data-context')) - Number(a.getAttribute('data-context'))
          if (sort === 'newest') return Number(b.getAttribute('data-date')) - Number(a.getAttribute('data-date'))
          return Number(b.getAttribute('data-popular')) - Number(a.getAttribute('data-popular'))
        })
        visible.forEach(function (card) {
          results.appendChild(card)
        })

          selectedModels.splice(index, 1)
        } else {
          if (selectedModels.length >= 3) {
            showToast('最多选择 3 个模型', '请先移除一个模型再继续')
            return
          }
          selectedModels.push({ id: id, name: name })
        }
        updateCompareBar()
        syncCompareButtons()
      }

      function updateCompareBar() {
        var bar = document.getElementById('compare-bar')
        var list = document.getElementById('compare-list')
        var count = document.getElementById('compare-count')
        count.textContent = selectedModels.length
        bar.classList.toggle('visible', selectedModels.length > 0)
        list.innerHTML = selectedModels.map(function (item) {
          return '<span class="compare-chip">' + item.name + '<button type="button" data-remove-compare="' + item.id + '" aria-label="移除 ' + item.name + '">✕</button></span>'
        }).join('')
      }

      function syncCompareButtons() {
        document.querySelectorAll('[data-compare-id]').forEach(function (button) {
          var selected = selectedModels.some(function (item) { return item.id === button.getAttribute('data-compare-id') })
          button.classList.toggle('selected', selected)
          button.setAttribute('aria-pressed', selected ? 'true' : 'false')
        })
        var detailButton = document.getElementById('detail-compare')
        if (detailButton) {
          var detailSelected = selectedModels.some(function (item) { return item.id === currentDetailModel.id })
          detailButton.textContent = detailSelected ? '已加入对比' : '加入对比'
        }
      }

      function openComparison() {
        if (selectedModels.length < 2) {
          showToast('请再选择一个模型', '至少选择 2 个模型才能对比')
          return
        }
        var items = selectedModels.map(function (item) { return comparisonData[item.id] })
        var placeholders = items.slice()
        while (placeholders.length < 3) placeholders.push(null)
        var rows = [
          ['模型'].concat(placeholders.map(function (item) { return item ? item.name : '—' })),
          ['提供商'].concat(placeholders.map(function (item) { return item ? item.provider : '—' })),
          ['输入 / 1M'].concat(placeholders.map(function (item) { return item ? item.input : '—' })),
          ['输出 / 1M'].concat(placeholders.map(function (item) { return item ? item.output : '—' })),
          ['上下文'].concat(placeholders.map(function (item) { return item ? item.context : '—' })),
          ['优势'].concat(placeholders.map(function (item) { return item ? item.strengths : '—' }))
        ]
        document.getElementById('comparison-content').innerHTML = '<div class="comparison-grid">' + rows.map(function (row) {
          return row.map(function (cell, index) {
            return '<div class="comparison-cell' + (index === 0 ? ' label' : '') + '">' + cell + '</div>'
          }).join('')
        }).join('') + '</div>'
        openOverlay('compare-backdrop', '.modal-close')
      }

      function formatRate(rate) {
        return '$' + Number(rate).toFixed(2)
      }

      function renderDetailCode(language) {
        var code = codeExamples[language].replace(/__MODEL__|anthropic\/claude-3\.7-sonnet/g, currentDetailModel.slug)
        var output = document.getElementById('detail-code')
        if (output) output.textContent = code
      }

      function updateModelDetail(route) {
        var id = resolveDetailId(route)
        currentDetailModel = detailCatalog[id] || detailCatalog['claude-3.7']
        document.getElementById('detail-breadcrumb-name').textContent = currentDetailModel.name
        document.getElementById('detail-glyph').textContent = currentDetailModel.glyph
        document.getElementById('detail-provider').textContent = currentDetailModel.provider
        document.getElementById('detail-model-name').textContent = currentDetailModel.name
        document.getElementById('detail-model-slug').textContent = currentDetailModel.slug
        document.getElementById('detail-slug-copy').setAttribute('data-copy', currentDetailModel.slug)
        document.getElementById('detail-input-price').textContent = currentDetailModel.input
        document.getElementById('detail-output-price').textContent = currentDetailModel.output
        document.getElementById('detail-input-note').textContent = currentDetailModel.inputNote
        document.getElementById('detail-context').textContent = currentDetailModel.context
        document.getElementById('detail-context-note').textContent = currentDetailModel.contextNote
        document.getElementById('detail-latency').textContent = currentDetailModel.latency
        document.getElementById('detail-uptime').textContent = currentDetailModel.uptime
        document.getElementById('detail-summary-title').textContent = currentDetailModel.summary
        document.getElementById('detail-summary-description').textContent = currentDetailModel.description
        document.getElementById('detail-tags').innerHTML = currentDetailModel.tags.map(function (tag, index) {
          return '<span class="tag' + (index === 0 ? ' violet' : '') + '">' + tag + '</span>'
        }).join('')
        document.getElementById('detail-direct-route').textContent = currentDetailModel.provider + ' Direct'
        document.getElementById('detail-route-input').textContent = currentDetailModel.input
        document.getElementById('detail-route-output').textContent = currentDetailModel.output
        document.getElementById('detail-route-latency').textContent = currentDetailModel.latency.replace('ms', ' ms')
        document.getElementById('detail-route-throughput').textContent = currentDetailModel.throughput
        document.getElementById('detail-route-a-input').textContent = formatRate(currentDetailModel.inputRate * 1.02)
        document.getElementById('detail-route-a-output').textContent = formatRate(currentDetailModel.outputRate * 1.02)
        document.getElementById('detail-route-b-input').textContent = formatRate(currentDetailModel.inputRate * 1.04)
        document.getElementById('detail-route-b-output').textContent = formatRate(currentDetailModel.outputRate * 1.04)
        renderDetailCode('python')
      }

      function updateEstimator() {
        var input = document.getElementById('input-tokens')
        var output = document.getElementById('output-tokens')
        var requests = document.getElementById('monthly-requests')
        if (!input || !output || !requests) return
        var inputValue = Number(input.value)
        var outputValue = Number(output.value)
        var requestValue = Number(requests.value)
        document.getElementById('input-token-value').textContent = inputValue.toLocaleString()
        document.getElementById('output-token-value').textContent = outputValue.toLocaleString()
        document.getElementById('request-value').textContent = requestValue.toLocaleString()
        var total = ((inputValue / 1000000 * currentDetailModel.inputRate) + (outputValue / 1000000 * currentDetailModel.outputRate)) * requestValue
        document.getElementById('estimate-total').textContent = '$' + total.toFixed(2)
      }

      function updateRanking(period) {
        var configs = {
          day: { label: '最近 24 小时', heights: [42, 57, 48, 66, 72, 64, 84], factor: 0.14 },
          week: { label: '最近 7 天', heights: [48, 61, 57, 73, 68, 86, 91], factor: 1 },
          month: { label: '最近 30 天', heights: [52, 49, 64, 68, 75, 82, 94], factor: 4.2 }
        }
        var config = configs[period]
        var label = document.getElementById('ranking-period-label')
        if (!label) return
        label.textContent = config.label
        document.querySelectorAll('.period-button').forEach(function (button) {
          button.classList.toggle('active', button.getAttribute('data-ranking-period') === period)
        })
        document.querySelectorAll('#ranking-chart .chart-bar').forEach(function (bar, index) {
          bar.style.height = config.heights[index] + '%'
        })
        document.querySelectorAll('[data-rank-metric]').forEach(function (cell) {
          if (!cell.getAttribute('data-week-value')) cell.setAttribute('data-week-value', cell.textContent)
          if (period === 'week') {
            cell.textContent = cell.getAttribute('data-week-value')
          } else {
            var raw = cell.getAttribute('data-week-value')
            var number = parseFloat(raw.replace(/[^0-9.]/g, ''))
            var prefix = raw.charAt(0) === '$' ? '$' : ''
            var suffix = raw.slice(prefix.length).replace(/[0-9.]/g, '')
            cell.textContent = prefix + (number * config.factor).toFixed(period === 'day' ? 2 : 1) + suffix
          }
        })
      }

      function renderMockKeys() {
        var tbody = document.getElementById('key-table-body')
        if (!tbody) return
        tbody.querySelectorAll('[data-created-key]').forEach(function (row) { row.remove() })
        mockKeys.slice().reverse().forEach(function (key) {
          var row = document.createElement('tr')
          row.setAttribute('data-key-row', '')
          row.setAttribute('data-created-key', '')
          row.setAttribute('data-key-search', (key.name + ' ' + key.prefix).toLowerCase())
          row.innerHTML = '<td><b></b></td><td><span class="key-prefix"></span></td><td></td><td>$0.00</td><td>刚刚</td><td><span class="health"><i class="status-dot"></i>启用</span></td><td><button class="inline-copy" type="button" data-demo-action="打开编辑 Key">编辑</button></td>'
          row.querySelector('b').textContent = key.name
          row.querySelector('.key-prefix').textContent = key.prefix
          row.children[2].textContent = '$' + key.budget + ' · ' + key.expiry
          tbody.prepend(row)
        })
      }

      function filterKeys() {
        var input = document.getElementById('key-search')
        if (!input) return
        var query = input.value.trim().toLowerCase()
        var rows = Array.from(document.querySelectorAll('[data-key-row]'))
        var visible = 0
        rows.forEach(function (row) {
          var show = !query || row.getAttribute('data-key-search').indexOf(query) >= 0
          row.style.display = show ? '' : 'none'
          if (show) visible += 1
        })
        document.getElementById('key-empty').style.display = visible ? 'none' : 'block'
      }

      function openKeyModal() {
        pendingKey = null
        var body = document.getElementById('create-key-form-body')
        var footer = document.getElementById('create-key-footer')
        body.innerHTML = '<div class="form-row"><label for="key-name">名称</label><input class="form-input" id="key-name" name="name" value="Production App" maxlength="32"></div><div class="form-row"><label for="key-budget">额度上限（USD）</label><input class="form-input" id="key-budget" name="budget" type="number" min="1" value="50"></div><div class="form-row"><label for="key-expiry">有效期</label><select class="form-input" id="key-expiry" name="expiry"><option>永不过期</option><option>30 天</option><option>90 天</option><option>1 年</option></select></div>'
        footer.innerHTML = '<button class="button" type="button" data-close-modal="create-key-backdrop">取消</button><button class="button primary" type="submit">创建 Key</button>'
        openOverlay('create-key-backdrop', '#key-name')
      }

      function submitKeyForm(event) {
        event.preventDefault()
        var nameInput = document.getElementById('key-name')
        var name = nameInput ? nameInput.value.trim() : 'New Key'
        if (!name) {
          showToast('请输入名称', 'Key 名称不能为空')
          return
        }
        var budgetInput = document.getElementById('key-budget')
        var expiryInput = document.getElementById('key-expiry')
        var secret = 'sk-tf-demo-9f31c2a8e7b645d0'
        pendingKey = {
          name: name,
          budget: Math.max(1, Number(budgetInput ? budgetInput.value : 50) || 50),
          expiry: expiryInput ? expiryInput.value : '永不过期',
          prefix: 'sk-tf-demo••••••45d0'
        }
        document.getElementById('create-key-form-body').innerHTML = '<div class="secret-box"><strong>API Key 创建成功</strong><p class="muted text-small" style="margin: 6px 0 0;">请立即复制。关闭后将无法再次查看完整密钥。</p><div class="secret-value"><span>' + secret + '</span><button class="inline-copy" type="button" data-copy="' + secret + '">复制</button></div></div>'
        document.getElementById('create-key-footer').innerHTML = '<button class="button primary" type="button" data-finish-key>我已保存</button>'
      }

      function openCommand() {
        var input = document.getElementById('command-input')
        input.value = ''
        renderCommands('')
        openOverlay('command-backdrop', '#command-input')
      }

      function setActiveCommand(index) {
        var items = Array.from(document.querySelectorAll('.command-item'))
        if (!items.length) return
        activeCommandIndex = (index + items.length) % items.length
        items.forEach(function (item, itemIndex) {
          var active = itemIndex === activeCommandIndex
          item.classList.toggle('active', active)
          item.setAttribute('aria-selected', active ? 'true' : 'false')
        })
        var input = document.getElementById('command-input')
        if (input) input.setAttribute('aria-activedescendant', items[activeCommandIndex].id)
      }

      function closeCommand() {
        closeOverlay('command-backdrop')
      }

      function renderCommands(query) {
        var normalized = query.trim().toLowerCase()
        commandMatches = commands.filter(function (command) {
          return !normalized || (command.label + ' ' + command.meta + ' ' + command.keywords).toLowerCase().indexOf(normalized) >= 0
        })
        activeCommandIndex = 0
        var list = document.getElementById('command-list')
        var input = document.getElementById('command-input')
        if (!commandMatches.length) {
          list.innerHTML = '<div class="empty-filter" style="display:block;border:0;padding:30px;">没有匹配的页面或模型</div>'
          if (input) input.removeAttribute('aria-activedescendant')
          return
        }
        list.innerHTML = commandMatches.map(function (command, index) {
          return '<button id="command-option-' + index + '" class="command-item' + (index === 0 ? ' active' : '') + '" type="button" role="option" aria-selected="' + (index === 0 ? 'true' : 'false') + '" data-command-route="' + command.route + '"><span class="command-icon">' + command.icon + '</span><span>' + command.label + '</span><small>' + command.meta + '</small></button>'
        }).join('')
        if (input) input.setAttribute('aria-activedescendant', 'command-option-0')
      }

      function clickHandler(event) {
        var routeTarget = event.target.closest('[data-route]')
        if (routeTarget) {
          event.preventDefault()
          navigate(routeTarget.getAttribute('data-route'))
          return
        }

        var copyTarget = event.target.closest('[data-copy]')
        if (copyTarget) {
          copyText(copyTarget.getAttribute('data-copy'))
          return
        }

        var actionTarget = event.target.closest('[data-demo-action]')
        if (actionTarget) {
          var action = actionTarget.getAttribute('data-demo-action')
          var demoMessages = {
            '打开充值流程': '演示环境已准备充值流程，下一步可选择支付渠道',
            '打开订阅计划': '演示环境已准备订阅计划，当前使用 Mock 数据',
            '打开用量记录': '演示环境已打开用量入口，记录由本地 Mock 数据提供',
            '打开完整用量记录': '演示环境已准备完整用量记录',
            '打开账单记录': '演示环境已准备账单入口，当前使用 Mock 数据',
            '打开邀请页面': '演示环境已准备邀请入口',
            '打开账户设置': '演示环境已准备账户设置入口',
            '打开编辑 Key': '演示环境已打开 Key 编辑入口'
          }
          showToast(action, demoMessages[action] || '当前操作使用本地 Mock 数据')
          return
        }

        var closeTarget = event.target.closest('[data-close-modal]')
        if (closeTarget) {
          closeOverlay(closeTarget.getAttribute('data-close-modal'))
          return
        }

        if (event.target.closest('[data-open-key-modal]')) {
          openKeyModal()
          return
        }

        if (event.target.closest('[data-finish-key]')) {
          if (pendingKey) {
            mockKeys.unshift(pendingKey)
            pendingKey = null
          }
          closeOverlay('create-key-backdrop')
          renderMockKeys()
          filterKeys()
          showToast('API Key 已创建', '新的 Mock Key 已加入列表')
          return
        }

        var compareButton = event.target.closest('[data-compare-id]')
        if (compareButton) {
          event.stopPropagation()
          toggleCompare(compareButton.getAttribute('data-compare-id'), compareButton.getAttribute('data-compare-name'))
          return
        }

        var removeCompare = event.target.closest('[data-remove-compare]')
        if (removeCompare) {
          toggleCompare(removeCompare.getAttribute('data-remove-compare'), '')
          return
        }

        var directoryCard = event.target.closest('.directory-model')
        if (directoryCard) {
          navigate('#/models/' + directoryCard.getAttribute('data-model-id'))
          return
        }

        var viewButton = event.target.closest('[data-view]')
        if (viewButton) {
          document.querySelectorAll('[data-view]').forEach(function (button) { button.classList.remove('active') })
          viewButton.classList.add('active')
          document.getElementById('models-results').classList.toggle('grid-view', viewButton.getAttribute('data-view') === 'grid')
          return
        }

        var abilityButton = event.target.closest('[data-ability-filter]')
        if (abilityButton) {
          var ability = abilityButton.getAttribute('data-ability-filter')
          activeAbility = activeAbility === ability ? '' : ability
          document.querySelectorAll('[data-ability-filter]').forEach(function (button) {
            button.classList.toggle('active', button.getAttribute('data-ability-filter') === activeAbility)
          })
          updateModelResults()
          return
        }

        var contextButton = event.target.closest('[data-context-filter]')
        if (contextButton) {
          activeContext = Number(contextButton.getAttribute('data-context-filter'))
          document.querySelectorAll('.context-chip').forEach(function (button) {
            button.classList.toggle('active', button === contextButton)
          })
          updateModelResults()
          return
        }

        if (event.target.closest('#reset-filters') || event.target.closest('#empty-reset')) {
          resetFilters()
          return
        }

        var detailTab = event.target.closest('[data-detail-tab]')
        if (detailTab) {
          var tab = detailTab.getAttribute('data-detail-tab')
          document.querySelectorAll('[data-detail-tab]').forEach(function (button) {
            var active = button === detailTab
            button.classList.toggle('active', active)
            button.setAttribute('aria-selected', active ? 'true' : 'false')
          })
          document.querySelectorAll('[data-detail-panel]').forEach(function (panel) {
            var active = panel.getAttribute('data-detail-panel') === tab
            panel.classList.toggle('active', active)
            panel.setAttribute('aria-hidden', active ? 'false' : 'true')
          })
          return
        }

        if (event.target.closest('#detail-compare')) {
          toggleCompare(currentDetailModel.id, currentDetailModel.shortName)
          return
        }

        var languageButton = event.target.closest('[data-code-language]')
        if (languageButton) {
          var language = languageButton.getAttribute('data-code-language')
          document.querySelectorAll('[data-code-language]').forEach(function (button) { button.classList.toggle('active', button === languageButton) })
          document.getElementById('detail-code-title').textContent = language === 'curl' ? 'cURL' : language.charAt(0).toUpperCase() + language.slice(1)
          renderDetailCode(language)
          return
        }

        if (event.target.closest('#copy-detail-code')) {
          copyText(document.getElementById('detail-code').textContent)
          return
        }

        var docLanguage = event.target.closest('[data-doc-language]')
        if (docLanguage) {
          var docLang = docLanguage.getAttribute('data-doc-language')
          document.querySelectorAll('[data-doc-language]').forEach(function (button) { button.classList.toggle('active', button === docLanguage) })
          document.getElementById('doc-code').textContent = docExamples[docLang]
          return
        }

        if (event.target.closest('#copy-doc-code')) {
          copyText(document.getElementById('doc-code').textContent)
          return
        }

        var periodButton = event.target.closest('[data-ranking-period]')
        if (periodButton) {
          updateRanking(periodButton.getAttribute('data-ranking-period'))
          return
        }

        var docsLink = event.target.closest('[data-doc-anchor]')
        if (docsLink) {
          var id = docsLink.getAttribute('data-doc-anchor')
          document.querySelectorAll('[data-doc-anchor]').forEach(function (button) { button.classList.toggle('active', button === docsLink) })
          document.getElementById(id).scrollIntoView({ behavior: 'smooth', block: 'start' })
          return
        }

        var commandRoute = event.target.closest('[data-command-route]')
        if (commandRoute) {
          closeCommand()
          navigate(commandRoute.getAttribute('data-command-route'))
          return
        }
      }

      document.addEventListener('click', clickHandler)

      document.addEventListener('input', function (event) {
        if (event.target.id === 'model-search') updateModelResults()
        if (event.target.id === 'key-search') filterKeys()
        if (event.target.id === 'command-input') renderCommands(event.target.value)
        if (['input-tokens', 'output-tokens', 'monthly-requests'].indexOf(event.target.id) >= 0) updateEstimator()
      })

      document.addEventListener('change', function (event) {
        if (event.target.matches('[data-provider-filter]') || event.target.id === 'model-sort') updateModelResults()
      })

      document.getElementById('open-command').addEventListener('click', openCommand)
      document.getElementById('open-compare').addEventListener('click', openComparison)
      document.getElementById('create-key-form').addEventListener('submit', submitKeyForm)
      document.getElementById('mobile-toggle').addEventListener('click', function () {
        openOverlay('mobile-backdrop', '#mobile-drawer')
      })
      document.getElementById('mobile-close').addEventListener('click', function () {
        closeOverlay('mobile-backdrop')
      })
      document.getElementById('mobile-filter-button').addEventListener('click', function () {
        var panel = document.getElementById('filter-panel')
        if (panel) panel.classList.toggle('open')
      })

      document.querySelectorAll('.modal-backdrop, .command-backdrop, .mobile-backdrop').forEach(function (backdrop) {
        backdrop.addEventListener('mousedown', function (event) {
          if (event.target === backdrop) closeOverlay(backdrop.id)
        })
      })

      document.addEventListener('keydown', function (event) {
        trapOverlayFocus(event)
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('.directory-model[role="link"]')) {
          event.preventDefault()
          navigate('#/models/' + event.target.getAttribute('data-model-id'))
          return
        }
        if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[role="link"][data-route]')) {
          event.preventDefault()
          navigate(event.target.getAttribute('data-route'))
          return
        }
        if ((event.key === 'ArrowLeft' || event.key === 'ArrowRight') && event.target.matches('[data-detail-tab]')) {
          event.preventDefault()
          var tabs = Array.from(document.querySelectorAll('[data-detail-tab]'))
          var currentIndex = tabs.indexOf(event.target)
          var direction = event.key === 'ArrowRight' ? 1 : -1
          var nextTab = tabs[(currentIndex + direction + tabs.length) % tabs.length]
          nextTab.focus()
          nextTab.click()
          return
        }
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault()
          openCommand()
        }
        if (event.key === 'Escape') {
          var openOverlayElement = document.querySelector('.modal-backdrop.open, .command-backdrop.open, .mobile-backdrop.open')
          if (openOverlayElement) closeOverlay(openOverlayElement.id)
          var panel = document.getElementById('filter-panel')
          if (panel) panel.classList.remove('open')
        }
        if (document.getElementById('command-backdrop').classList.contains('open') && document.activeElement === document.getElementById('command-input')) {
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault()
            setActiveCommand(activeCommandIndex + (event.key === 'ArrowDown' ? 1 : -1))
            return
          }
          if (event.key === 'Enter') {
            event.preventDefault()
            var activeCommand = document.querySelector('.command-item.active')
            if (activeCommand) activeCommand.click()
          }
        }
      })

      window.addEventListener('hashchange', renderRoute)
      window.addEventListener('resize', function () {
        var button = document.getElementById('mobile-filter-button')
        button.style.display = window.location.hash === '#/models' && window.innerWidth <= 800 ? 'inline-flex' : 'none'
      })

      updateCompareBar()
      renderCommands('')
      renderRoute()
    })()
  </script>
</body>
