  <!-- PROTOTYPE ONLY: throwaway visual demo with mock data; not production code. -->
  <style>
    :root {
      --canvas: #09070c;
      --canvas-soft: #0f0c12;
      --surface-1: #19161d;
      --surface-2: #211d27;
      --surface-3: #28242e;
      --elevated: #352f3d;
      --accent: #9046ff;
      --accent-hover: #a66bff;
      --accent-soft: #c6a0ff;
      --accent-faint: rgba(144, 70, 255, 0.13);
      --accent-button: #7130ce;
      --accent-button-hover: #7d37df;
      --text: #f8f8fa;
      --text-2: #c9c3cf;
      --muted: #9b94a4;
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --success: #35d482;
      --warning: #f6bd60;
      --danger: #ff6b7a;
      --info: #69b7ff;
      --radius-sm: 8px;
      --radius: 12px;
      --radius-lg: 18px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --max-width: 1240px;
      --header-height: 64px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-width: 320px;
      margin: 0;
      background: var(--canvas);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      color: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    :focus-visible {
      outline: 2px solid var(--accent-soft);
      outline-offset: 3px;
    }

    ::selection {
      background: rgba(144, 70, 255, 0.42);
      color: #fff;
    }

    .mono {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .app-header {
      position: sticky;
      z-index: 50;
      top: 0;
      height: var(--header-height);
      border-bottom: 1px solid var(--border);
      background: rgba(9, 7, 12, 0.86);
      backdrop-filter: blur(18px);
    }

    .header-inner {
      display: flex;
      width: min(calc(100% - 40px), var(--max-width));
      height: 100%;
      align-items: center;
      gap: 20px;
      margin: 0 auto;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-family: "Avenir Next", "Segoe UI Variable Display", Inter, ui-sans-serif, system-ui, sans-serif;
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.005em;
      text-transform: lowercase;
    }

    .brand-mark {
      position: relative;
      display: grid;
      width: 27px;
      height: 27px;
      grid-template-columns: repeat(3, 1fr);
      align-items: end;
      gap: 3px;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgba(198, 160, 255, 0.45);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(144, 70, 255, 0.28), rgba(144, 70, 255, 0.04));
      box-shadow: inset 0 0 14px rgba(144, 70, 255, 0.15);
    }

    .brand-mark i {
      display: block;
      border-radius: 99px;
      background: var(--accent-soft);
      box-shadow: 0 0 8px rgba(198, 160, 255, 0.65);
    }

    .brand-mark i:nth-child(1) {
      height: 45%;
    }

    .brand-mark i:nth-child(2) {
      height: 100%;
    }

    .brand-mark i:nth-child(3) {
      height: 68%;
    }

    .brand em {
      font-style: normal;
      font-weight: 500;
      color: #e81e6a;
    }

    .primary-nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 550;
      transition: 160ms ease;
    }

    .nav-link:hover,
    .nav-link.active {
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
    }

    .nav-link.active {
      box-shadow: inset 0 -1px 0 var(--accent);
    }

    .header-search {
      display: flex;
      width: min(260px, 24vw);
      align-items: center;
      gap: 9px;
      margin-left: auto;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.035);
      color: var(--muted);
      cursor: pointer;
      text-align: left;
      transition: 160ms ease;
    }

    .header-search:hover {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.055);
    }

    .header-search span:nth-child(2) {
      overflow: hidden;
      flex: 1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .keycap {
      padding: 1px 5px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface-2);
      color: var(--text-2);
      font-size: 10px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 11px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 12px rgba(53, 212, 130, 0.68);
    }

    .button {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 13px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      font-weight: 650;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .button:hover {
      border-color: var(--border-strong);
      background: var(--surface-2);
      transform: translateY(-1px);
    }

    .button.primary {
      border-color: var(--accent-button);
      background: var(--accent-button);
      box-shadow: 0 8px 24px rgba(144, 70, 255, 0.23);
    }

    .button.primary:hover {
      border-color: var(--accent-button-hover);
      background: var(--accent-button-hover);
    }

    .button.ghost {
      background: transparent;
    }

    .button.small {
      min-height: 32px;
      padding: 6px 10px;
      font-size: 12px;
    }

    .button.icon-only {
      width: 38px;
      padding: 0;
    }

    .mobile-toggle {
      display: none;
    }

    #app {
      min-height: calc(100vh - var(--header-height));
    }

    .page-shell {
      width: min(calc(100% - 40px), var(--max-width));
      margin: 0 auto;
      padding: 44px 0 72px;
    }

    .page-shell.wide {
      width: min(calc(100% - 32px), 1390px);
    }

    .page-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      color: var(--accent-soft);
      font-family: "SFMono-Regular", Consolas, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .page-kicker::before {
      width: 18px;
      height: 1px;
      background: currentColor;
      content: "";
    }

    h1,
    h2,
    h3,
    h4,
    p {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 16px;
      font-size: clamp(36px, 5vw, 68px);
      line-height: 0.98;
      letter-spacing: -0.06em;
    }

    h2 {
      margin-bottom: 12px;
      font-size: clamp(26px, 3vw, 42px);
      line-height: 1.05;
      letter-spacing: -0.045em;
    }

    h3 {
      margin-bottom: 8px;
      font-size: 18px;
      letter-spacing: -0.025em;
    }

    .muted {
      color: var(--muted);
    }

    .text-small {
      font-size: 12px;
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 12px;
    }

    .breadcrumb button {
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
    }

    .hero {
      position: relative;
      display: grid;
      min-height: 590px;
      grid-template-columns: minmax(0, 0.92fr) minmax(480px, 1.08fr);
      align-items: center;
      gap: 64px;
      overflow: hidden;
      padding: 64px 0 54px;
    }

    .hero::before {
      position: absolute;
      z-index: -1;
      top: 7%;
      left: -17%;
      width: 630px;
      height: 630px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(144, 70, 255, 0.18), rgba(144, 70, 255, 0.035) 45%, transparent 70%);
      content: "";
      filter: blur(2px);
    }

    .hero-copy {
      max-width: 600px;
    }

    .hero-copy h1 span {
      background: linear-gradient(100deg, #fff 10%, var(--accent-soft) 78%);
      background-clip: text;
      color: transparent;
    }

    .hero-copy > p {
      max-width: 560px;
      margin-bottom: 26px;
      color: var(--text-2);
      font-size: 17px;
      line-height: 1.72;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 25px;
    }

    .trust-line {
      display: flex;
      flex-wrap: wrap;
      gap: 14px 22px;
      color: var(--muted);
      font-size: 12px;
    }

    .trust-line span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .trust-line b {
      color: var(--success);
    }

    .route-console {
      position: relative;
      min-height: 470px;
      padding: 16px;
      border: 1px solid var(--border-strong);
      border-radius: 22px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.025), transparent 40%),
        rgba(25, 22, 29, 0.88);
      box-shadow: var(--shadow), inset 0 0 70px rgba(144, 70, 255, 0.045);
    }

    .route-console::before {
      position: absolute;
      z-index: -1;
      inset: 15% -10%;
      border-radius: 50%;
      background: rgba(144, 70, 255, 0.2);
      content: "";
      filter: blur(80px);
    }

    .console-window-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 3px 2px 14px;
      color: var(--muted);
      font: 11px "SFMono-Regular", Consolas, monospace;
    }

    .window-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--elevated);
    }

    .console-window-bar span:nth-child(4) {
      margin-left: 8px;
    }

    .route-map {
      position: relative;
      height: 245px;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 14px;
      background:
        linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        #100d13;
      background-size: 30px 30px;
    }

    .route-map svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .route-path {
      fill: none;
      stroke: rgba(198, 160, 255, 0.34);
      stroke-width: 1.25;
    }

    .route-path.active {
      stroke: var(--accent-soft);
      stroke-dasharray: 5 9;
      animation: routeFlow 1.3s linear infinite;
      filter: drop-shadow(0 0 4px rgba(198, 160, 255, 0.72));
    }

    .route-node {
      position: absolute;
      display: flex;
      min-width: 104px;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(33, 29, 39, 0.94);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .route-node.source {
      top: 96px;
      left: 20px;
      border-color: rgba(198, 160, 255, 0.5);
      color: var(--accent-soft);
    }

    .route-node.node-a {
      top: 24px;
      right: 19px;
    }

    .route-node.node-b {
      top: 100px;
      right: 19px;
    }

    .route-node.node-c {
      right: 19px;
      bottom: 22px;
    }

    .provider-glyph {
      display: grid;
      width: 24px;
      height: 24px;
      flex: 0 0 auto;
      place-items: center;
      border-radius: 7px;
      background: rgba(144, 70, 255, 0.13);
      color: var(--accent-soft);
      font-weight: 700;
    }

    .route-node small {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 8px;
    }

    .live-request {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 12px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--canvas-soft);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .live-request strong {
      color: var(--success);
      font-weight: 700;
    }

    .route-metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 8px;
    }

    .route-metric {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.025);
    }

    .route-metric small {
      display: block;
      margin-bottom: 4px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .route-metric b {
      font: 700 15px "SFMono-Regular", Consolas, monospace;
    }

    @keyframes routeFlow {
      to {
        stroke-dashoffset: -28;
      }
    }

    .section {
      padding: 74px 0;
      border-top: 1px solid var(--border);
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 28px;
    }

    .section-head p {
      max-width: 570px;
      margin-bottom: 0;
      color: var(--muted);
    }

    .model-strip {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }

    .model-card {
      position: relative;
      min-width: 0;
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
      cursor: pointer;
      transition: 180ms ease;
    }

    .model-card:hover {
      border-color: rgba(198, 160, 255, 0.32);
      background: var(--surface-2);
      transform: translateY(-3px);
    }

    .model-card[role="link"],
    .directory-model[role="link"],
    .ranking-row[role="link"] {
      cursor: pointer;
    }

    .model-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }

    .model-top > div:nth-child(2) {
      min-width: 0;
      flex: 1;
    }

    .model-name {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .model-provider {
      color: var(--muted);
      font-size: 11px;
    }

    .trend {
      color: var(--success);
      font: 700 11px "SFMono-Regular", Consolas, monospace;
    }

    .model-description {
      min-height: 42px;
      margin-bottom: 15px;
      color: var(--text-2);
      font-size: 12px;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.025);
      color: var(--text-2);
      font-size: 10px;
      white-space: nowrap;
    }

    .tag.violet {
      border-color: rgba(144, 70, 255, 0.28);
      background: rgba(144, 70, 255, 0.09);
      color: var(--accent-soft);
    }

    .model-price {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
      padding-top: 13px;
      border-top: 1px solid var(--border);
    }

    .model-price small {
      display: block;
      color: var(--muted);
      font-size: 9px;
    }

    .model-price b {
      font: 650 12px "SFMono-Regular", Consolas, monospace;
    }

    .value-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .value-card {
      min-height: 190px;
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(145deg, rgba(144, 70, 255, 0.06), transparent 47%),
        var(--surface-1);
    }

    .value-index {
      margin-bottom: 40px;
      color: var(--accent-soft);
      font: 700 12px "SFMono-Regular", Consolas, monospace;
    }

    .value-card p {
      margin-bottom: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .cta-panel {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 40px;
      align-items: center;
      padding: 42px;
      overflow: hidden;
      border: 1px solid rgba(198, 160, 255, 0.22);
      border-radius: 20px;
      background:
        radial-gradient(circle at 85% 30%, rgba(144, 70, 255, 0.24), transparent 38%),
        var(--surface-1);
    }

    .code-window {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #0d0b0f;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.26);
    }

    .code-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 10px;
    }

    pre {
      overflow: auto;
      margin: 0;
      padding: 18px;
      color: #d8d3dd;
      font: 11px/1.75 "SFMono-Regular", Consolas, monospace;
      tab-size: 2;
    }

    .code-purple {
      color: var(--accent-soft);
    }

    .code-green {
      color: var(--success);
    }

    .page-title-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 30px;
    }

    .page-title-row h1 {
      margin-bottom: 8px;
      font-size: clamp(36px, 4vw, 52px);
    }

    .page-title-row p {
      margin-bottom: 0;
      color: var(--muted);
    }

    .or-title-row {
      align-items: center;
      margin-bottom: 18px;
    }

    .or-models-title {
      font-size: 24px;
      font-weight: 650;
      letter-spacing: 0;
      margin: 0;
    }

    .or-title-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .models-layout {
      display: grid;
      grid-template-columns: 238px minmax(0, 1fr);
      gap: 28px;
      align-items: start;
    }

    .filter-panel {
      position: sticky;
      top: calc(var(--header-height) + 46px);
      padding: 17px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .filter-group + .filter-group {
      margin-top: 20px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
    }

    .filter-label {
      display: block;
      margin-bottom: 10px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .check-row {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 6px 0;
      color: var(--text-2);
      cursor: pointer;
      font-size: 12px;
    }

    .check-row input {
      width: 15px;
      height: 15px;
      accent-color: var(--accent);
    }

    .check-row span:last-child {
      margin-left: auto;
      color: var(--muted);
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    /* OpenRouter-style collapsible filter groups */
    .fgroup + .fgroup {
      margin-top: 2px;
    }

    .fgroup-head {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 9px;
      padding: 9px 2px;
      border: 0;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      text-align: left;
    }

    .fg-ico {
      width: 15px;
      height: 15px;
      flex: 0 0 auto;
      color: var(--muted);
    }

    .fgroup-head > span:nth-child(2) {
      flex: 1;
    }

    .fg-arrow {
      color: var(--muted);
      font-size: 13px;
    }

    .fgroup-body {
      display: none;
      padding: 2px 0 10px 24px;
    }

    .fgroup.open > .fgroup-body {
      display: block;
    }

    .fgroup.open .fg-arrow {
      transform: rotate(0deg);
    }

    .fgroup:not(.open) .fg-arrow {
      transform: rotate(0deg);
    }

    /* modality tabs row under toolbar */
    .modality-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .mtab {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 6px 9px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }

    .mtab svg {
      flex: 0 0 auto;
    }

    .mtab b {
      font-weight: 600;
    }

    .mtab:hover {
      color: var(--text);
      background: var(--surface-2);
    }

    .mtab.active {
      color: var(--accent-soft);
      background: var(--accent-faint);
    }

    .mtab-more {
      margin-left: auto;
    }

    .range-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .filter-chip {
      padding: 5px 7px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }

    .filter-chip.active {
      border-color: rgba(144, 70, 255, 0.45);
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .models-content {
      min-width: 0;
    }

    .model-toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 1fr) auto auto auto auto;
      gap: 10px;
      margin-bottom: 13px;
    }

    .input-shell {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 40px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
      color: var(--muted);
    }

    .input-shell input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
    }

    .input-shell input::placeholder {
      color: #766f7e;
    }

    .select {
      min-height: 40px;
      padding: 0 32px 0 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: 0;
      background: var(--surface-1);
      color: var(--text-2);
      cursor: pointer;
    }

    .view-toggle {
      display: flex;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
    }

    .view-button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      width: auto;
      min-width: 34px;
      padding: 0 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .view-button.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .result-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .models-results {
      display: grid;
      gap: 8px;
    }

    .directory-model {
      position: relative;
      display: block;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface-1);
      cursor: pointer;
      transition: 160ms ease;
    }

    .directory-model:hover {
      border-color: rgba(198, 160, 255, 0.28);
      background: var(--surface-2);
    }

    .or-head {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 10px;
      padding-right: 110px;
    }

    .or-head h3 {
      overflow: hidden;
      margin: 0;
      font-size: 14px;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .or-icon {
      display: inline-grid;
      width: 17px;
      height: 17px;
      margin-left: 4px;
      place-items: center;
      border-radius: 4px;
      background: var(--accent-faint);
      color: var(--accent-soft);
      font-size: 10px;
      font-weight: 600;
      vertical-align: 1px;
    }

    .or-tokens {
      position: absolute;
      top: 16px;
      right: 18px;
      color: var(--muted);
      font: 11px "SFMono-Regular", Consolas, monospace;
      white-space: nowrap;
    }

    .or-desc {
      display: -webkit-box;
      overflow: hidden;
      margin: 8px 0 0;
      color: var(--text-2);
      font-size: 12px;
      line-height: 1.55;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
    }

    .or-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 11px;
    }

    .or-meta span + span {
      position: relative;
      padding-left: 12px;
    }

    .or-meta span + span::before {
      position: absolute;
      left: 0;
      color: var(--border-strong);
      content: "|";
    }

    .or-by {
      color: var(--text-2);
      font-weight: 600;
      text-decoration: underline;
      text-decoration-color: var(--border-strong);
      text-underline-offset: 3px;
    }

    .directory-main {
      display: flex;
      min-width: 0;
      align-items: center;
      gap: 11px;
    }

    .directory-main > div:last-child {
      min-width: 0;
    }

    .directory-main h3 {
      overflow: hidden;
      margin: 0 0 3px;
      font-size: 14px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .directory-main p {
      overflow: hidden;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .directory-tags {
      display: flex;
      max-height: 24px;
      flex-wrap: nowrap;
      gap: 5px;
      overflow: hidden;
    }

    .directory-tags .tag {
      flex: 0 0 auto;
    }

    .directory-stat small {
      display: block;
      margin-bottom: 3px;
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .directory-stat b {
      font: 600 11px "SFMono-Regular", Consolas, monospace;
    }

    .models-results.grid-view {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .models-results.grid-view .directory-model {
      display: block;
      min-height: 0;
      position: relative;
      padding-bottom: 20px;
    }

    .models-results.grid-view .or-head {
      padding-right: 110px;
    }

    .models-results.grid-view .directory-tags {
      min-height: 0;
      margin: 16px 0;
    }

    .models-results.grid-view .directory-stat {
      display: inline-block;
      width: 31%;
      vertical-align: top;
    }

    .model-detail-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 24px;
      align-items: start;
      margin-bottom: 28px;
    }

    .detail-identity {
      display: flex;
      align-items: start;
      gap: 16px;
    }

    .detail-identity .provider-glyph {
      width: 48px;
      height: 48px;
      border-radius: 13px;
      font-size: 17px;
    }

    .detail-identity h1 {
      margin: 0 0 5px;
      font-size: clamp(30px, 4vw, 48px);
    }

    .model-slug {
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font: 11px "SFMono-Regular", Consolas, monospace;
    }

    .inline-copy {
      padding: 3px 6px;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      font-size: 10px;
    }

    .detail-actions {
      display: flex;
      gap: 8px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-bottom: 26px;
    }

    .metric-card {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .metric-card small {
      display: block;
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .metric-card b {
      display: block;
      font: 700 15px "SFMono-Regular", Consolas, monospace;
    }

    .metric-card span {
      color: var(--muted);
      font-size: 10px;
    }

    .detail-tabs {
      display: flex;
      gap: 3px;
      margin-bottom: 22px;
      padding-bottom: 1px;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .detail-tab {
      padding: 10px 13px;
      border: 0;
      border-bottom: 2px solid transparent;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }

    .detail-tab.active {
      border-bottom-color: var(--accent);
      color: var(--text);
    }

    .detail-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 26px;
      align-items: start;
    }

    .detail-panel {
      display: none;
    }

    .detail-panel.active {
      display: block;
    }

    .detail-panel[aria-hidden="true"] {
      display: none;
    }

    .content-card {
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .content-card + .content-card {
      margin-top: 12px;
    }

    .content-card p:last-child {
      margin-bottom: 0;
    }

    .provider-table {
      width: 100%;
      border-collapse: collapse;
    }

    .provider-table th,
    .provider-table td {
      padding: 12px 10px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 11px;
      white-space: nowrap;
    }

    .provider-table th {
      color: var(--muted);
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .provider-table tr:last-child td {
      border-bottom: 0;
    }

    .health {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--success);
    }

    .estimator {
      position: sticky;
      top: calc(var(--header-height) + 45px);
      padding: 19px;
      border: 1px solid rgba(198, 160, 255, 0.23);
      border-radius: var(--radius);
      background:
        linear-gradient(145deg, rgba(144, 70, 255, 0.08), transparent 45%),
        var(--surface-1);
    }

    .estimator-row {
      margin-top: 18px;
    }

    .estimator-row label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 11px;
    }

    .estimator-row label b {
      color: var(--text);
      font-family: "SFMono-Regular", Consolas, monospace;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }

    .estimate-total {
      margin-top: 20px;
      padding-top: 17px;
      border-top: 1px solid var(--border);
    }

    .estimate-total small {
      display: block;
      color: var(--muted);
      font-size: 10px;
    }

    .estimate-total strong {
      display: block;
      margin: 5px 0;
      font: 750 25px "SFMono-Regular", Consolas, monospace;
    }

    .language-tabs {
      display: flex;
      gap: 4px;
    }

    .language-tab {
      padding: 4px 7px;
      border: 0;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
    }

    .language-tab.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .ranking-hero {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(430px, 1.15fr);
      gap: 40px;
      align-items: center;
      margin-bottom: 38px;
    }

    .ranking-hero h1 {
      text-wrap: balance;
    }

    .ranking-summary {
      padding: 24px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-1);
    }

    .ranking-summary .bar-chart {
      background-image: repeating-linear-gradient(
        to top,
        transparent 0,
        transparent 39px,
        var(--border) 39px,
        var(--border) 40px
      );
      background-position: 0 0;
    }

    .period-toggle {
      display: inline-flex;
      gap: 3px;
      margin-bottom: 24px;
      padding: 3px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-1);
    }

    .period-button {
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 11px;
    }

    .period-button.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .bar-chart {
      display: flex;
      height: 220px;
      align-items: end;
      gap: 9px;
      padding-top: 16px;
      border-bottom: 1px solid var(--border);
    }

    .chart-column {
      position: relative;
      display: flex;
      min-width: 0;
      height: 100%;
      flex: 1;
      flex-direction: column;
      align-items: center;
      justify-content: end;
      padding-bottom: 20px;
      color: var(--muted);
      font: 9px "SFMono-Regular", Consolas, monospace;
    }

    .chart-column > span {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      text-align: center;
    }

    .chart-bar {
      width: 100%;
      max-width: 34px;
      min-height: 12px;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, var(--accent-hover), rgba(144, 70, 255, 0.25));
      box-shadow: 0 0 20px rgba(144, 70, 255, 0.16);
      transition: height 420ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .ranking-list {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .ranking-row {
      display: grid;
      grid-template-columns: 46px minmax(240px, 1.2fr) 0.8fr 0.7fr 0.7fr 80px;
      align-items: center;
      gap: 14px;
      padding: 15px 18px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
    }

    .ranking-row:last-child {
      border-bottom: 0;
    }

    .ranking-row:hover {
      background: rgba(255, 255, 255, 0.025);
    }

    .ranking-row.header {
      color: var(--muted);
      cursor: default;
      font-size: 9px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .rank-number {
      font: 700 16px "SFMono-Regular", Consolas, monospace;
    }

    .rank-change.up {
      color: var(--success);
    }

    .rank-change.down {
      color: var(--danger);
    }

    .pricing-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
      margin: 34px 0 58px;
    }

    .pricing-card {
      position: relative;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background: var(--surface-1);
    }

    .pricing-card.featured {
      border-color: rgba(198, 160, 255, 0.42);
      background:
        radial-gradient(circle at 90% 0, rgba(144, 70, 255, 0.18), transparent 36%),
        var(--surface-1);
    }

    .pricing-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 4px 7px;
      border-radius: 6px;
      background: var(--accent-faint);
      color: var(--accent-soft);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .price {
      margin: 22px 0;
      font: 750 34px "SFMono-Regular", Consolas, monospace;
    }

    .price small {
      color: var(--muted);
      font: 11px Inter, sans-serif;
    }

    .feature-list {
      display: grid;
      gap: 10px;
      margin: 20px 0 25px;
      padding: 0;
      list-style: none;
      color: var(--text-2);
      font-size: 12px;
    }

    .feature-list li {
      display: flex;
      gap: 8px;
    }

    .feature-list li::before {
      color: var(--success);
      content: "✓";
    }

    .price-table {
      overflow: auto;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .docs-layout {
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 190px;
      gap: 34px;
      align-items: start;
    }

    .docs-sidebar,
    .docs-toc {
      position: sticky;
      top: calc(var(--header-height) + 46px);
    }

    .docs-nav-group + .docs-nav-group {
      margin-top: 22px;
    }

    .docs-nav-title {
      margin-bottom: 7px;
      color: var(--muted);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .docs-link {
      display: block;
      width: 100%;
      padding: 7px 9px;
      border: 0;
      border-left: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }

    .docs-link:hover,
    .docs-link.active {
      border-left-color: var(--accent);
      background: linear-gradient(90deg, var(--accent-faint), transparent);
      color: var(--text);
    }

    .docs-article {
      min-width: 0;
      max-width: 760px;
    }

    .docs-article h1 {
      font-size: clamp(34px, 4vw, 52px);
    }

    .docs-article h2 {
      margin-top: 42px;
      padding-top: 12px;
      font-size: 24px;
    }

    .docs-article p {
      color: var(--text-2);
      line-height: 1.8;
    }

    .callout {
      margin: 20px 0;
      padding: 14px 16px;
      border: 1px solid rgba(105, 183, 255, 0.24);
      border-radius: 10px;
      background: rgba(105, 183, 255, 0.07);
      color: var(--text-2);
      font-size: 12px;
    }

    .docs-toc {
      padding-left: 15px;
      border-left: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .docs-toc a,
    .docs-toc button {
      display: block;
      width: 100%;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .console-shell {
      display: grid;
      min-height: calc(100vh - var(--header-height));
      grid-template-columns: 220px minmax(0, 1fr);
    }

    .console-sidebar {
      padding: 24px 14px;
      border-right: 1px solid var(--border);
      background: rgba(15, 12, 18, 0.76);
    }

    .account-card {
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--surface-1);
    }

    .account-row {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .avatar {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, var(--accent), #5d2ca8);
      font-size: 11px;
      font-weight: 700;
    }

    .account-row strong {
      display: block;
      font-size: 12px;
    }

    .account-row small {
      color: var(--muted);
      font-size: 9px;
    }

    .console-nav {
      display: grid;
      gap: 3px;
      margin-top: 20px;
    }

    .console-nav-label {
      margin: 14px 9px 5px;
      color: #746d7b;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .console-nav-button {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      text-align: left;
    }

    .console-nav-button:hover,
    .console-nav-button.active {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .console-nav-button.active {
      box-shadow: inset 2px 0 0 var(--accent);
    }

    .console-main {
      min-width: 0;
      padding: 36px;
    }

    .console-heading {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }

    .console-heading h1 {
      margin: 0 0 4px;
      font-size: 32px;
    }

    .console-heading p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 12px;
    }

    .dashboard-card {
      min-width: 0;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-1);
    }

    .dashboard-card.span-3 {
      grid-column: span 3;
    }

    .dashboard-card.span-5 {
      grid-column: span 5;
    }

    .dashboard-card.span-7 {
      grid-column: span 7;
    }

    .dashboard-card.span-12 {
      grid-column: span 12;
    }

    .dashboard-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
    }

    .dashboard-value {
      margin-bottom: 6px;
      font: 740 25px "SFMono-Regular", Consolas, monospace;
    }

    .usage-chart {
      display: flex;
      height: 160px;
      align-items: end;
      gap: 6px;
      padding-top: 15px;
      border-bottom: 1px solid var(--border);
    }

    .usage-bar {
      flex: 1;
      min-width: 4px;
      border-radius: 3px 3px 0 0;
      background: linear-gradient(180deg, var(--accent), rgba(144, 70, 255, 0.18));
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .quick-action {
      min-height: 78px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: var(--surface-2);
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .quick-action:hover {
      border-color: rgba(198, 160, 255, 0.3);
    }

    .quick-action b {
      display: block;
      margin-bottom: 5px;
      color: var(--text);
      font-size: 12px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
    }

    .data-table th,
    .data-table td {
      padding: 11px 9px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      font-size: 11px;
      white-space: nowrap;
    }

    .data-table th {
      color: var(--muted);
      font-size: 9px;
      text-transform: uppercase;
    }

    .data-table tr:last-child td {
      border-bottom: 0;
    }

    .key-prefix {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font: 10px "SFMono-Regular", Consolas, monospace;
    }

    .key-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
    }

    .key-toolbar .input-shell {
      width: min(360px, 100%);
    }

    .empty-filter {
      display: none;
      padding: 48px 20px;
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .modal-backdrop,
    .command-backdrop,
    .mobile-backdrop {
      position: fixed;
      z-index: 90;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(4, 3, 5, 0.72);
      backdrop-filter: blur(8px);
    }

    .modal-backdrop.open,
    .command-backdrop.open,
    .mobile-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(100%, 500px);
      max-height: min(760px, calc(100vh - 40px));
      overflow: auto;
      border: 1px solid var(--border-strong);
      border-radius: 16px;
      background: var(--surface-1);
      box-shadow: var(--shadow);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 17px 19px;
      border-bottom: 1px solid var(--border);
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--border);
      border-bottom: 0;
    }

    .modal-header h3 {
      margin: 0;
    }

    .modal-close {
      width: 30px;
      height: 30px;
      border: 0;
      border-radius: 7px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
    }

    .modal-body {
      padding: 19px;
    }

    .form-row + .form-row {
      margin-top: 16px;
    }

    .form-row label {
      display: block;
      margin-bottom: 7px;
      color: var(--text-2);
      font-size: 11px;
      font-weight: 650;
    }

    .form-input {
      width: 100%;
      min-height: 40px;
      padding: 0 11px;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: 0;
      background: var(--canvas-soft);
      color: var(--text);
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .secret-box {
      padding: 15px;
      border: 1px solid rgba(246, 189, 96, 0.28);
      border-radius: 10px;
      background: rgba(246, 189, 96, 0.07);
    }

    .secret-value {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0d0b0f;
      font: 10px "SFMono-Regular", Consolas, monospace;
      word-break: break-all;
    }

    .secret-value span {
      flex: 1;
    }

    .command-modal {
      width: min(100%, 660px);
      align-self: start;
      margin-top: 10vh;
      overflow: hidden;
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      background: rgba(25, 22, 29, 0.98);
      box-shadow: var(--shadow);
    }

    .command-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 15px;
      border-bottom: 1px solid var(--border);
    }

    .command-input-row input {
      min-width: 0;
      flex: 1;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font-size: 15px;
    }

    .command-list {
      max-height: 370px;
      overflow: auto;
      padding: 8px;
    }

    .command-item {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .command-item:hover,
    .command-item.active {
      background: var(--surface-3);
      color: var(--text);
    }

    .command-icon {
      display: grid;
      width: 28px;
      height: 28px;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--accent-soft);
      font-size: 11px;
    }

    .command-item > span:nth-child(2) {
      flex: 1;
    }

    .command-item small {
      color: var(--muted);
    }

    .mobile-drawer {
      width: min(340px, 90vw);
      height: 100%;
      margin-left: auto;
      padding: 18px;
      background: var(--surface-1);
      box-shadow: var(--shadow);
    }

    .mobile-drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .mobile-nav {
      display: grid;
      gap: 5px;
    }

    .mobile-nav button {
      padding: 12px;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: var(--text-2);
      cursor: pointer;
      text-align: left;
    }

    .mobile-nav button:hover {
      background: var(--surface-3);
    }

    .toast-region {
      position: fixed;
      z-index: 120;
      right: 18px;
      bottom: 18px;
      display: grid;
      gap: 8px;
      pointer-events: none;
    }

    .toast {
      min-width: 250px;
      padding: 12px 14px;
      border: 1px solid rgba(198, 160, 255, 0.3);
      border-radius: 10px;
      background: rgba(33, 29, 39, 0.96);
      box-shadow: var(--shadow);
      color: var(--text-2);
      font-size: 12px;
      animation: toastIn 180ms ease both;
    }

    .toast strong {
      display: block;
      margin-bottom: 2px;
      color: var(--text);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
    }

    .site-footer {
      border-top: 1px solid var(--border);
      background: #070509;
    }

    .footer-inner {
      display: flex;
      width: min(calc(100% - 40px), var(--max-width));
      min-height: 96px;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 11px;
    }

    .footer-links {
      display: flex;
      gap: 18px;
    }

    .mobile-filter-button {
      display: none;
    }

    @media (max-width: 1080px) {
      .primary-nav,
      .status-pill {
        display: none;
      }

      .header-search {
        margin-left: auto;
      }

      .mobile-toggle {
        display: inline-flex;
      }

      .hero {
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .hero-copy {
        max-width: 720px;
      }

      .route-console {
        max-width: 760px;
      }

      .model-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .directory-model {
        grid-template-columns: minmax(220px, 1.2fr) minmax(140px, 0.8fr) 125px 40px;
      }

      .directory-model .directory-stat.context-stat {
        display: none;
      }

      .metric-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .ranking-hero {
        grid-template-columns: 1fr;
      }

      .docs-layout {
        grid-template-columns: 190px minmax(0, 1fr);
      }

      .docs-toc {
        display: none;
      }

      .dashboard-card.span-3 {
        grid-column: span 6;
      }

      .dashboard-card.span-5,
      .dashboard-card.span-7 {
        grid-column: span 12;
      }
    }

    @media (max-width: 800px) {
      .header-inner {
        width: min(calc(100% - 24px), var(--max-width));
        gap: 10px;
      }

      .brand > span:last-child {
        display: none;
      }

      .header-search {
        width: 40px;
        justify-content: center;
      }

      .header-search span:not(:first-child) {
        display: none;
      }

      .header-actions .button:not(.mobile-toggle) {
        display: none;
      }

      .page-shell,
      .page-shell.wide {
        width: min(calc(100% - 24px), var(--max-width));
        padding-top: 30px;
      }

      .hero {
        min-height: 0;
        padding-top: 40px;
      }

      .route-console {
        min-height: 430px;
      }

      .section {
        padding: 54px 0;
      }

      .section-head,
      .page-title-row,
      .console-heading {
        align-items: start;
        flex-direction: column;
      }

      .section-head,
      .page-title-row {
        display: flex;
      }

      .value-grid,
      .pricing-grid {
        grid-template-columns: 1fr;
      }

      .cta-panel {
        grid-template-columns: 1fr;
        padding: 26px;
      }

      .models-layout {
        grid-template-columns: 1fr;
      }

      .filter-panel {
        position: fixed;
        z-index: 80;
        right: 12px;
        bottom: 74px;
        left: 12px;
        top: auto;
        display: none;
        max-height: 68vh;
        overflow: auto;
        box-shadow: var(--shadow);
      }

      .filter-panel.open {
        display: block;
      }

      .mobile-filter-button {
        position: fixed;
        z-index: 44;
        right: 14px;
        bottom: 17px;
        display: inline-flex;
      }

      .or-head {
        flex-wrap: wrap;
        padding-right: 0;
      }

      @media (max-width: 520px) {
      .hero-copy > p {
        font-size: 15px;
      }

      .hero-actions .button {
        width: 100%;
      }

      .route-console {
        min-height: 405px;
        padding: 11px;
        border-radius: 15px;
      }

      .route-map {
        height: 220px;
      }

      .route-node {
        min-width: 93px;
        padding: 7px;
        font-size: 8px;
      }

      .route-node.source {
        left: 10px;
      }

      .route-node.node-a,
      .route-node.node-b,
      .route-node.node-c {
        right: 10px;
      }

      .model-strip {
        grid-template-columns: 1fr;
      }

      .metric-grid {
        grid-template-columns: 1fr 1fr;
      }

      .metric-card {
        padding: 12px;
      }

      .model-toolbar {
        grid-template-columns: 1fr auto;
      }

      .model-toolbar .select {
        grid-column: 1 / -1;
        grid-row: 2;
      }

      .footer-inner {
        align-items: start;
        flex-direction: column;
        padding: 24px 0;
      }
    }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* Customer color system + OpenRouter-inspired homepage composition. */
    :root {
      color-scheme: light;
      --canvas: #f4f6f8;
      --canvas-soft: #f8fafb;
      --surface-1: #ffffff;
      --surface-2: #f8fafb;
      --surface-3: #eff1ec;
      --elevated: #e4e7ec;
      --accent: #0fb477;
      --accent-hover: #0aa668;
      --accent-soft: #067647;
      --accent-faint: #ecfdf3;
      --accent-button: #0fb477;
      --accent-button-hover: #0aa668;
      --text: #101828;
      --text-2: #475467;
      --muted: #667085;
      --border: #e4e7ec;
      --border-strong: #d9dee6;
      --success: #0fb477;
      --warning: #b54708;
      --danger: #d92d20;
      --info: #1570ef;
      --shadow: 0 12px 36px rgba(16, 24, 40, 0.08);
    }

    body {
      background: var(--canvas);
      color: var(--text);
    }

    ::selection {
      background: rgba(15, 180, 119, 0.22);
      color: #03301f;
    }

    .app-header {
      border-bottom-color: var(--border);
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 1px 0 rgba(16, 24, 40, 0.02);
    }

    .header-inner {
      width: min(calc(100% - 40px), 1440px);
    }

    .brand {
      order: 1;
      color: #11142a;
    }

    .brand-mark {
      border-color: #abefc6;
      background: linear-gradient(145deg, #ecfdf3, #d1fadf);
      box-shadow: inset 0 0 12px rgba(15, 180, 119, 0.08);
    }

    .brand-mark i {
      background: var(--accent);
      box-shadow: none;
    }

    .primary-nav {
      order: 3;
      margin-left: auto;
    }

    .header-search {
      order: 2;
      width: min(280px, 23vw);
      margin-left: 12px;
      border-color: var(--border);
      background: #f8fafb;
      color: var(--muted);
    }

    .header-search:hover {
      border-color: #abefc6;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(15, 180, 119, 0.08);
    }

    .header-actions {
      order: 4;
    }

    .keycap {
      border-color: var(--border);
      background: #ffffff;
      color: var(--muted);
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .nav-link.active {
      box-shadow: inset 0 -2px 0 var(--accent);
    }

    .button {
      border-color: var(--border-strong);
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04);
    }

    .button:hover {
      border-color: #abefc6;
      background: #f8fafb;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #03301f;
      box-shadow: 0 10px 24px rgba(15, 180, 119, 0.16);
    }

    .button.primary:hover {
      border-color: var(--accent-hover);
      background: var(--accent-hover);
      color: #021f15;
    }

    .page-kicker,
    .value-index {
      color: var(--accent-soft);
    }

    .provider-glyph {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .tag {
      border-color: var(--border);
      background: #f8fafb;
      color: var(--text-2);
    }

    .tag.violet {
      border-color: #abefc6;
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .model-card,
    .value-card,
    .content-card,
    .pricing-card,
    .dashboard-card,
    .filter-panel,
    .directory-model,
    .ranking-list,
    .ranking-summary,
    .metric-card,
    .estimator {
      border-color: var(--border);
      background: var(--surface-1);
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.035);
    }

    .model-card:hover,
    .directory-model:hover,
    .ranking-row:hover {
      border-color: #abefc6;
      background: #fbfffd;
      box-shadow: 0 10px 24px rgba(16, 24, 40, 0.06);
    }

    .input-shell,
    .select,
    .view-toggle,
    .form-input {
      border-color: var(--border);
      background: #ffffff;
      color: var(--text);
    }

    .filter-chip,
    .inline-copy {
      border-color: var(--border);
      color: var(--muted);
    }

    .filter-chip.active {
      border-color: #abefc6;
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .bar-chart,
    .usage-chart {
      border-bottom-color: var(--border);
    }

    .chart-bar,
    .usage-bar {
      background: linear-gradient(180deg, #0fb477, rgba(15, 180, 119, 0.18));
      box-shadow: 0 0 18px rgba(15, 180, 119, 0.12);
    }

    .console-sidebar {
      border-right-color: var(--border);
      background: rgba(248, 250, 251, 0.9);
    }

    .account-card,
    .quick-action {
      border-color: var(--border);
      background: #ffffff;
    }

    .console-nav-button:hover,
    .console-nav-button.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .avatar {
      background: linear-gradient(135deg, #0c8f60, #077a53);
      color: #ffffff;
    }

    .modal {
      border-color: var(--border-strong);
      background: #ffffff;
    }

    .command-modal {
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.98);
    }

    .command-item:hover,
    .command-item.active {
      background: var(--accent-faint);
      color: var(--accent-soft);
    }

    .mobile-drawer {
      background: #ffffff;
    }

    .toast {
      border-color: #abefc6;
      background: rgba(255, 255, 255, 0.98);
      color: var(--text-2);
    }

    .toast strong {
      color: var(--text);
    }

    .site-footer {
      border-top-color: var(--border);
      background: #ffffff;
    }

    .code-window {
      border-color: #344054;
      background: #101828;
    }

    .code-titlebar {
      border-bottom-color: #344054;
      color: #98a2b3;
    }

    .code-window .inline-copy {
      border-color: #475467;
      color: #d0d5dd;
    }

    .code-purple {
      color: #6ce9a6;
    }

    .code-green {
      color: #32d583;
    }

    .secret-value {
      border-color: #344054;
      background: #101828;
      color: #f2f4f7;
    }

    .secret-value .inline-copy {
      border-color: #475467;
      color: #d0d5dd;
    }

    .callout {
      border-color: #b2ddff;
      background: #eff8ff;
    }

    .value-card {
      background:
        linear-gradient(145deg, #ecfdf3, transparent 48%),
        #ffffff;
    }

    .cta-panel {
      border-color: #abefc6;
      background:
        linear-gradient(145deg, #ecfdf3, rgba(236, 253, 243, 0) 48%),
        #ffffff;
    }

    .pricing-card.featured {
      border-color: #abefc6;
      background:
        linear-gradient(180deg, #ecfdf3, rgba(236, 253, 243, 0) 44%),
        #ffffff;
    }

    .quick-action:hover {
      border-color: #abefc6;
      background: #fbfffd;
    }

    .premium-home {
      position: relative;
      overflow: hidden;
      background: var(--canvas);
    }

    .premium-shell {
      width: min(calc(100% - 40px), 1440px);
      padding-top: 0;
    }

    .premium-hero {
      position: relative;
      display: grid;
      min-height: 670px;
      place-items: center;
      text-align: center;
    }

    .premium-hero-copy {
      position: relative;
      z-index: 2;
      width: min(100%, 920px);
      padding-bottom: 150px;
    }

    .premium-overline {
      display: inline-flex;
      align-items: center;
